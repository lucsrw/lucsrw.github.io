:root{--azul-900:#0b2447;--azul-800:#10315a;--azul-700:#14417a;--azul-600:#1c5aa6;--azul-500:#2d6fc4;--azul-400:#4d8ede;--azul-100:#e8f0fb;--azul-50:#f4f8fd;--branco:#ffffff;--cinza-fundo:#f7f8fa;--cinza-borda:#e4e7ec;--texto-principal:#1a2433;--texto-secundario:#5b6779;--texto-terciario:#8a94a3;--sombra-leve:0 1px 2px rgba(16, 49, 90, 0.06), 0 1px 1px rgba(16, 49, 90, 0.04);--sombra-media:0 8px 24px rgba(16, 49, 90, 0.10);--raio:10px;--raio-peq:6px;--fonte:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;--altura-tela:100vh}@supports (height:100dvh){:root{--altura-tela:100dvh}}*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:var(--fonte);background:var(--cinza-fundo);color:var(--texto-principal);line-height:1.5;-webkit-font-smoothing:antialiased}img,svg{display:block;max-width:100%}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--azul-500);outline-offset:2px;border-radius:var(--raio-peq)}.cabecalho{background:var(--branco);border-bottom:1px solid var(--cinza-borda);padding:56px 24px 44px;text-align:center}.cabecalho__nome{font-size:clamp(1.75rem, 4vw, 2.5rem);font-weight:700;letter-spacing:-.02em;color:var(--azul-900)}.cabecalho__nome .cabecalho__letra{display:inline-block;opacity:0;transform:translateY(24px) rotate(6deg) scale(.6);filter:blur(4px);animation:encaixarLetra 0.7s cubic-bezier(.2,.9,.25,1.1) forwards;animation-delay:calc(var(--indice-letra) * 45ms)}.cabecalho__nome .cabecalho__espaco{display:inline-block;width:.32em}@keyframes encaixarLetra{0%{opacity:0;transform:translateY(24px) rotate(6deg) scale(.6);filter:blur(4px)}60%{opacity:1;transform:translateY(-3px) rotate(-1deg) scale(1.04);filter:blur(0)}100%{opacity:1;transform:translateY(0) rotate(0) scale(1);filter:blur(0)}}.cabecalho__subtitulo{margin-top:10px;font-size:1rem;color:var(--texto-secundario);font-weight:400;opacity:0;animation:surgirSuave 0.6s ease forwards;animation-delay:0.9s}.cabecalho__linha{width:48px;height:3px;background:var(--azul-500);border-radius:2px;margin:20px auto 0;transform:scaleX(0);animation:expandirLinha 0.6s ease forwards;animation-delay:1.1s}@keyframes surgirSuave{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes expandirLinha{to{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.cabecalho__nome .cabecalho__letra,.cabecalho__subtitulo,.cabecalho__linha{animation:none!important;opacity:1!important;transform:none!important;filter:none!important}}.container{max-width:1200px;margin:0 auto;padding:0 24px}.barra-ferramentas{padding:40px 0 24px;position:sticky;top:0;background:var(--cinza-fundo);z-index:10}.busca{position:relative;max-width:520px;margin:0 auto 20px}.busca__input{width:100%;padding:13px 16px 13px 44px;font-size:.95rem;color:var(--texto-principal);background:var(--branco);border:1px solid var(--cinza-borda);border-radius:var(--raio);box-shadow:var(--sombra-leve);transition:border-color 0.15s ease,box-shadow 0.15s ease}.busca__input::placeholder{color:var(--texto-terciario)}.busca__input:focus{border-color:var(--azul-500);box-shadow:0 0 0 3px var(--azul-100)}.busca__icone{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--texto-terciario);pointer-events:none}.filtros{display:flex;flex-wrap:nowrap;justify-content:flex-start;gap:8px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 2px 6px}.filtros::-webkit-scrollbar{display:none}.filtro-btn{padding:7px 16px;font-size:.85rem;font-weight:500;color:var(--texto-secundario);background:var(--branco);border:1px solid var(--cinza-borda);border-radius:999px;transition:all 0.15s ease;white-space:nowrap;flex:0 0 auto}.filtro-btn:hover{border-color:var(--azul-400);color:var(--azul-600)}.filtro-btn.ativo{background:var(--azul-600);border-color:var(--azul-600);color:var(--branco)}@media (min-width:620px){.filtros{justify-content:center;overflow-x:visible;flex-wrap:wrap}}.info-resultado{text-align:center;font-size:.83rem;color:var(--texto-terciario);padding-bottom:20px}.grid-certificados{display:grid;grid-template-columns:1fr;gap:18px;padding-bottom:60px}@media (min-width:620px){.grid-certificados{grid-template-columns:repeat(2,1fr)}}@media (min-width:960px){.grid-certificados{grid-template-columns:repeat(3,1fr)}}@media (min-width:1280px){.grid-certificados{grid-template-columns:repeat(4,1fr)}}.card{background:var(--branco);border:1px solid var(--cinza-borda);border-radius:var(--raio);box-shadow:var(--sombra-leve);padding:22px;display:flex;flex-direction:column;gap:12px;transition:box-shadow 0.2s ease,transform 0.2s ease,border-color 0.2s ease}.card:hover{box-shadow:var(--sombra-media);transform:translateY(-2px);border-color:var(--azul-100)}.card__categoria{display:inline-flex;align-self:flex-start;font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--azul-600);background:var(--azul-50);border:1px solid var(--azul-100);padding:4px 10px;border-radius:999px}.card__titulo{font-size:1.05rem;font-weight:600;color:var(--texto-principal);line-height:1.35}.card__instituicao{font-size:.88rem;color:var(--texto-secundario)}.card__data{font-size:.8rem;color:var(--texto-terciario);margin-top:-4px}.card__acoes{margin-top:auto;padding-top:10px;display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.83rem;font-weight:500;padding:9px 14px;border-radius:var(--raio-peq);border:1px solid #fff0;transition:background 0.15s ease,border-color 0.15s ease,color 0.15s ease;flex:1;white-space:nowrap}.btn svg{width:14px;height:14px;flex-shrink:0}.btn--principal{background:var(--azul-600);color:var(--branco)}.btn--principal:hover{background:var(--azul-700)}.btn--secundario{background:var(--branco);color:var(--azul-600);border-color:var(--cinza-borda);flex:0 0 auto;padding:9px 12px}.btn--secundario:hover{border-color:var(--azul-400);background:var(--azul-50)}.estado-vazio{grid-column:1 / -1;text-align:center;padding:70px 20px;color:var(--texto-terciario)}.estado-vazio svg{width:40px;height:40px;margin:0 auto 14px;color:var(--azul-100);stroke:var(--azul-300,#9dbde7)}.estado-vazio p{font-size:.95rem}.rodape{text-align:center;padding:30px 20px 40px;font-size:.78rem;color:var(--texto-terciario);border-top:1px solid var(--cinza-borda)}.modal-overlay{position:fixed;inset:0;height:var(--altura-tela);background:rgb(11 36 71 / .55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.2s ease}.modal-overlay.aberto{opacity:1;pointer-events:auto}.modal{background:var(--branco);border-radius:var(--raio);width:100%;max-width:900px;height:min(90vh, 90dvh, 820px);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgb(11 36 71 / .35);transform:translateY(10px) scale(.98);transition:transform 0.2s ease}.modal-overlay.aberto .modal{transform:translateY(0) scale(1)}.modal__header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;padding-top:max(16px, env(safe-area-inset-top));border-bottom:1px solid var(--cinza-borda);flex-wrap:nowrap}.modal__titulos{min-width:0;flex:1 1 auto;overflow:hidden}.modal__titulo{font-size:clamp(.8rem, 3.6vw, .98rem);font-weight:600;color:var(--texto-principal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.modal__subtitulo{font-size:.8rem;color:var(--texto-terciario);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.modal__botoes{display:flex;align-items:center;gap:8px;flex-shrink:0}.modal__fechar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--raio-peq);color:var(--texto-secundario);transition:background 0.15s ease,color 0.15s ease;flex-shrink:0}.modal__fechar:hover{background:#fde8e8;color:#c0392b}.modal__fechar svg{width:18px;height:18px}.modal__corpo{flex:1 1 auto;min-height:0;background:var(--cinza-fundo);position:relative}.modal__corpo iframe{width:100%;height:100%;border:none;display:block}.modal__fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;color:var(--texto-secundario)}.modal__fallback.visivel{display:flex}.visualmente-oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@media (max-width:619px){.cabecalho{padding:44px 20px 34px}.barra-ferramentas{padding:28px 0 18px}.modal-overlay{padding:0;align-items:stretch;justify-content:stretch}.modal{height:var(--altura-tela);max-height:var(--altura-tela);max-width:100%;border-radius:0}.modal__header{padding:14px 16px;padding-top:max(14px, env(safe-area-inset-top));gap:8px}.modal__botoes .btn--secundario span{display:none}.modal__botoes .btn--secundario{padding:9px}}</style>

<body>
  <header class="cabecalho"><h1 class="cabecalho__nome" id="cabecalho-nome" aria-label="Lucas Rocha Will"></h1><p class="cabecalho__subtitulo">Certificados e qualificações</p><div class="cabecalho__linha" aria-hidden="true"></div></header><main class="container"><section class="barra-ferramentas" aria-label="Busca e filtros de certificados"><div class="busca"><svg class="busca__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><label for="campo-busca" class="visualmente-oculto">Pesquisar certificados</label><input type="text" id="campo-busca" class="busca__input" placeholder="Pesquisar por nome, instituição, categoria..." autocomplete="off" ></div><div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoria"></div></section><p class="info-resultado" id="info-resultado" aria-live="polite"></p><section class="grid-certificados" id="grid-certificados" aria-live="polite"></section></main><footer class="rodape"><p>&copy; <span id="ano-atual"></span> Lucas Rocha Will — Todos os certificados aqui exibidos são de propriedade do titular.</p></footer><div class="modal-overlay" id="sobreposicao-modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo"><div class="modal"><div class="modal__header"><div class="modal__titulos"><p class="modal__titulo" id="modal-titulo">Título do certificado</p><p class="modal__subtitulo" id="modal-subtitulo">Instituição</p></div><div class="modal__botoes"><a href="#" target="_blank" rel="noopener" class="btn btn--secundario" id="modal-abrir-nova-aba"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg><span>Nova aba</span></a><button class="modal__fechar" id="modal-fechar" aria-label="Fechar visualização"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div></div><div class="modal__corpo"><iframe id="modal-iframe" title="Visualização do certificado em PDF"></iframe><div class="modal__fallback" id="modal-fallback"><p>Não foi possível exibir o PDF diretamente neste navegador.</p><a href="#" target="_blank" rel="noopener" class="btn btn--principal" id="modal-fallback-link" style="flex:none; padding:10px 20px;"> Abrir PDF em nova aba </a></div></div></div></div>
  <script>
const certificados=[{titulo:"Segurança Cibernética",instituicao:"",categoria:"Cibersegurança",data:"",arquivo:"certificados/seguranca-cibernetica.pdf",palavrasChave:["segurança","cibernética","cibersegurança"]},{titulo:"Segurança da Informação para Todos",instituicao:"",categoria:"Segurança da Informação",data:"",arquivo:"certificados/seguranca-da-informacao-para-todos.pdf",palavrasChave:["segurança","informação","segurança da informação"]},{titulo:"Liderança em IA",instituicao:"",categoria:"Inteligência Artificial",data:"",arquivo:"certificados/lideranca-em-ia.pdf",palavrasChave:["liderança","IA","inteligência artificial"]},{titulo:"Engenharia de Prompt",instituicao:"",categoria:"Inteligência Artificial",data:"",arquivo:"certificados/engenharia-de-prompt.pdf",palavrasChave:["engenharia de prompt","prompt","IA","inteligência artificial"]},{titulo:"Inteligência Artificial Generativa",instituicao:"",categoria:"Inteligência Artificial",data:"",arquivo:"certificados/inteligencia-artificial-generativa.pdf",palavrasChave:["inteligência artificial","IA","IA generativa","inteligência artificial generativa"]}];const elementoGrade=document.getElementById('grid-certificados');const elementoBusca=document.getElementById('campo-busca');const elementoFiltros=document.getElementById('filtros');const elementoInfoResultado=document.getElementById('info-resultado');const elementoNomeCabecalho=document.getElementById('cabecalho-nome');const sobreposicaoModal=document.getElementById('sobreposicao-modal');const iframeModal=document.getElementById('modal-iframe');const tituloModal=document.getElementById('modal-titulo');const subtituloModal=document.getElementById('modal-subtitulo');const linkNovaAbaModal=document.getElementById('modal-abrir-nova-aba');const botaoFecharModal=document.getElementById('modal-fechar');const fallbackModal=document.getElementById('modal-fallback');const linkFallbackModal=document.getElementById('modal-fallback-link');let categoriaAtiva='Todas';let ultimoElementoFocado=null;const iconeOlho=`
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>`;const iconeExterno=`
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
      <polyline points="15 3 21 3 21 9"></polyline>
      <line x1="10" y1="14" x2="21" y2="3"></line>
    </svg>`;function animarNomeCabecalho(){const nome='Lucas Rocha Will';elementoNomeCabecalho.innerHTML=nome.split('').map((caractere,indice)=>{if(caractere===' '){return'<span class="cabecalho__espaco" aria-hidden="true"></span>'}
return `<span class="cabecalho__letra" style="--indice-letra:${indice}" aria-hidden="true">${escaparHtml(caractere)}</span>`}).join('')}
function montarFiltros(){const categorias=['Todas',...new Set(certificados.map(c=>c.categoria))];elementoFiltros.innerHTML=categorias.map(cat=>`
      <button
        class="filtro-btn ${cat === categoriaAtiva ? 'ativo' : ''}"
        data-categoria="${escaparHtml(cat)}"
        aria-pressed="${cat === categoriaAtiva}"
      >${escaparHtml(cat)}</button>
    `).join('');elementoFiltros.querySelectorAll('.filtro-btn').forEach(botao=>{botao.addEventListener('click',()=>{categoriaAtiva=botao.dataset.categoria;montarFiltros();renderizarCertificados()})})}
function normalizar(texto){return(texto||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function escaparHtml(texto){const div=document.createElement('div');div.textContent=texto;return div.innerHTML}
function filtrarCertificados(){const termo=normalizar(elementoBusca.value.trim());return certificados.filter(certificado=>{const combinaCategoria=categoriaAtiva==='Todas'||certificado.categoria===categoriaAtiva;if(!combinaCategoria)return!1;if(!termo)return!0;const camposBusca=normalizar([certificado.titulo,certificado.instituicao,certificado.categoria,...(certificado.palavrasChave||[])].join(' '));return camposBusca.includes(termo)})}
function renderizarCertificados(){const resultado=filtrarCertificados();if(resultado.length===0){elementoGrade.innerHTML=`
        <div class="estado-vazio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <p>Nenhum certificado encontrado.</p>
        </div>
      `;elementoInfoResultado.textContent='';return}
elementoGrade.innerHTML=resultado.map((certificado,indice)=>`
      <article class="card">
        <span class="card__categoria">${escaparHtml(certificado.categoria)}</span>
        <h2 class="card__titulo">${escaparHtml(certificado.titulo)}</h2>
        <p class="card__instituicao">${escaparHtml(certificado.instituicao)}</p>
        ${certificado.data ? `<p class="card__data">${escaparHtml(certificado.data)}</p>` : ''}
        <div class="card__acoes">
          <button class="btn btn--principal" data-abrir-modal="${indice}">
            ${iconeOlho}
            Visualizar certificado
          </button>
          <a class="btn btn--secundario" href="${escaparHtml(certificado.arquivo)}" target="_blank" rel="noopener" aria-label="Abrir ${escaparHtml(certificado.titulo)} em nova aba">
            ${iconeExterno}
          </a>
        </div>
      </article>
    `).join('');elementoGrade.querySelectorAll('[data-abrir-modal]').forEach(botao=>{botao.addEventListener('click',()=>{const certificado=resultado[Number(botao.dataset.abrirModal)];abrirModal(certificado)})});const total=certificados.length;const encontrados=resultado.length;elementoInfoResultado.textContent=(elementoBusca.value.trim()||categoriaAtiva!=='Todas')?`${encontrados} de ${total} certificado${total !== 1 ? 's' : ''} encontrado${encontrados !== 1 ? 's' : ''}`:`${total} certificado${total !== 1 ? 's' : ''} no total`}
function abrirModal(certificado){ultimoElementoFocado=document.activeElement;tituloModal.textContent=certificado.titulo;subtituloModal.textContent=certificado.instituicao;linkNovaAbaModal.href=certificado.arquivo;linkFallbackModal.href=certificado.arquivo;fallbackModal.classList.remove('visivel');iframeModal.style.display='block';iframeModal.src=certificado.arquivo;iframeModal.onerror=()=>{iframeModal.style.display='none';fallbackModal.classList.add('visivel')};sobreposicaoModal.classList.add('aberto');document.body.style.overflow='hidden';botaoFecharModal.focus()}
function fecharModal(){sobreposicaoModal.classList.remove('aberto');document.body.style.overflow='';iframeModal.src='';if(ultimoElementoFocado){ultimoElementoFocado.focus()}}
botaoFecharModal.addEventListener('click',fecharModal);sobreposicaoModal.addEventListener('click',(evento)=>{if(evento.target===sobreposicaoModal)fecharModal();});document.addEventListener('keydown',(evento)=>{if(evento.key==='Escape'&&sobreposicaoModal.classList.contains('aberto')){fecharModal()}});elementoBusca.addEventListener('input',renderizarCertificados);document.getElementById('ano-atual').textContent=new Date().getFullYear();animarNomeCabecalho();montarFiltros();renderizarCertificados()
  </script>
</body>
